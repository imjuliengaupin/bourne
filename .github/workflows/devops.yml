name: CI/CD
run-name: CI/CD pipeline initiated

on:
  push:
    branches: [SIT, PROD]
  pull_request:
    branches: [PROD]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pylint --quiet
          pip install -e .[test] --quiet

      - name: Run linter
        # Remove `--exit-zero` to force the pipeline build to fail if linter discrepancies are found
        run: |
          pylint $(git ls-files "*.py") --exit-zero

  mypy:
    runs-on: ubuntu-latest
    needs: pylint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install mypy --quiet
          pip install -e .[test] --quiet

      - name: Run static type checks
        run: |
          mypy $(git ls-files "*.py") --ignore-missing-imports

  pytest-unit:
    runs-on: ubuntu-latest
    needs: mypy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .[test] --quiet

      - name: Run unit tests
        run: |
          pytest -m "unit" -v --tb=short

  pytest-all:
    runs-on: ubuntu-latest
    needs: pytest-unit
    if: always()
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install -e .[test] --quiet

      - name: Run all tests
        run: |
          pytest tests/ -v --tb=short --junitxml=test-results.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-${{ github.run_id }}
          path: test-results.xml
          retention-days: 30

  pytest-cov:
    runs-on: ubuntu-latest
    needs: pytest-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install coveralls --quiet
          pip install -e .[test] --quiet

      - name: Generate code coverage report
        run: |
          pytest --cov=agents --cov=core --cov=schemas --cov-report html:coverage/coverage_report/ tests/

      - name: Upload code coverage report to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload code coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-${{ github.run_id }}
          path: coverage/coverage_report/
          if-no-files-found: error
          retention-days: 30

  pdoc3:
    runs-on: ubuntu-latest
    needs: pytest-all
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pdoc3 --quiet
          pip install -e . --quiet

      - name: Generate code documentation
        run: |
          pdoc --force --html agents core schemas --output-dir docs/

      - name: Upload code documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-documentation-${{ github.run_id }}
          path: docs/
          if-no-files-found: error
          retention-days: 30
