name: CI/CD
run-name: CI/CD pipeline initiated

on:
  push:
    branches: [SIT]
  pull_request:
    branches: [PROD]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pylint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pylint --quiet
          pip install -r requirements.txt --quiet

      - name: Run linter
        # NOTE remove `--exit-zero` to force the pipeline build to fail if linter discrepancies are found
        run: |
          pylint $(git ls-files "*.py") --exit-zero

  mypy:
    runs-on: ubuntu-latest
    needs: pylint
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install mypy --quiet
          pip install -r requirements.txt --quiet

      - name: Run static type checks
        run: |
          mypy $(git ls-files "*.py")

  pytest:
    runs-on: ubuntu-latest
    needs: mypy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest --quiet
          pip install -r requirements.txt --quiet

      - name: Run unit tests
        run: |
          pytest tests/ --quiet

  pytest-cov:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pytest-cov coveralls --quiet
          pip install -r requirements.txt --quiet

      - name: Generate code coverage report
        run: |
          pytest --cov tests/ --cov-report html:coverage/coverage_report/ --cov-config coverage/.coveragerc

      - name: Upload code coverage report to Coveralls
        uses: coverallsapp/github-action@v2
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload code coverage report artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-coverage-report-${{ github.run_id }}
          path: coverage/coverage_report/
          if-no-files-found: error
          retention-days: 30

  pdoc3:
    runs-on: ubuntu-latest
    needs: pytest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install pdoc3 --quiet
          pip install -r requirements.txt --quiet

      - name: Generate code documentation
        run: |
          pdoc --force --html $(git ls-files "*.py") --output-dir docs/

      - name: Upload code documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: code-documentation-${{ github.run_id }}
          path: docs/
          if-no-files-found: error
          retention-days: 30
